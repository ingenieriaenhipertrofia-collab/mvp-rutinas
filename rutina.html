<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rutina · Ingeniería en Hipertrofia</title>
<style>
:root{
  --bg:#f4f5f6;
  --card:#ffffff;
  --ink:#14212b;
  --gold:#c5a548;
  --muted:#6f7a82;
  --line:#d9dee2;
  --soft:#f7f8f9;
  --day:#eef1f4;
  --day-head:#e5e9ed;
  --accent:#14212b;
  --note:#fff8e7;
  --note-line:#e7d7a6;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.header{
  background:var(--ink);
  color:#fff;
  padding:20px 18px 16px;
  border-bottom:3px solid var(--gold);
  text-align:left;
}
.header h1{
  margin:0;
  font-size:21px;
  letter-spacing:0;
}
.header p{
  margin:4px 0 0;
  color:var(--gold);
  font-size:13px;
}
.wrap{
  max-width:900px;
  margin:0 auto;
  padding:0 14px 36px;
}
.main-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.035);
}
.topline{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:12px;
  margin-bottom:16px;
  flex-wrap:wrap;
}
.eyebrow{
  font-size:11px;
  font-weight:800;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--muted);
}
.topline h2{
  margin:3px 0 0;
  font-size:25px;
}
.summary{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
}
.day-card{
  background:var(--day);
  border:1px solid #d8dde3;
  border-radius:16px;
  overflow:hidden;
  margin-top:14px;
}
.day-head{
  padding:15px 16px;
  background:var(--day-head);
  border-bottom:1px solid #d5dbe1;
}
.day-title{
  font-size:18px;
  font-weight:850;
}
.day-meta{
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
}
.day-body{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.exercise-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
}
.exercise-title{
  font-weight:850;
  font-size:16px;
}
.exercise-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:7px;
}
.pill{
  background:var(--soft);
  border:1px solid #e7eaee;
  border-radius:999px;
  padding:6px 9px;
  font-size:12px;
  color:#4b5563;
  font-weight:700;
}
.note{
  margin-top:11px;
  padding:10px 11px;
  background:var(--note);
  border:1px solid var(--note-line);
  border-radius:10px;
  font-size:13px;
  line-height:1.45;
}
.video{
  display:inline-flex;
  margin-top:11px;
  text-decoration:none;
  color:#111827;
  font-size:13px;
  font-weight:800;
  border:1px solid #d7dce2;
  border-radius:10px;
  padding:9px 11px;
  background:#fff;
}
.super-card{
  background:#fff;
  border:1px solid var(--line);
  border-left:4px solid var(--accent);
  border-radius:13px;
  padding:14px;
}
.super-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:flex-start;
  flex-wrap:wrap;
}
.super-title{
  font-weight:900;
  font-size:16px;
}
.super-sub{
  color:var(--ink);
  font-size:14px;
  font-weight:800;
  margin-top:6px;
  line-height:1.2;
}
.super-list{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:9px;
}
.super-ex{
  border:1px solid #e4e7eb;
  border-radius:11px;
  padding:11px 12px;
  background:#fafbfc;
}
.super-ex-name{
  font-weight:800;
}
.super-ex-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}
.loading,.error,.empty{
  padding:30px 12px;
  text-align:center;
  color:var(--muted);
}
.error{color:#9b2c2c}
.footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:18px 0 0;
}
.pdf-actions{
  display:flex;
  justify-content:center;
  padding:12px 0 2px;
}
.pdf-btn{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  background:var(--ink);
  color:#fff;
  font:inherit;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
}
.pdf-btn:hover{opacity:.94}
.pdf-export-root{
  position:fixed;
  left:-100000px;
  top:0;
  width:900px;
  background:var(--bg);
  z-index:-1;
}
.pdf-export-root .wrap{
  max-width:900px;
  width:100%;
}
.pdf-keys{
  display:none;
}
.pdf-export-root .pdf-keys{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:10px;
}
.pdf-key{
  border:1px solid var(--line);
  border-radius:9px;
  padding:9px 10px;
  background:#fff;
  min-width:0;
}
.pdf-key-title{
  font-size:10px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:4px;
}
.pdf-key-text{
  font-size:11px;
  line-height:1.35;
  color:var(--ink);
  overflow-wrap:anywhere;
}

@media(max-width:640px){
  .main-card{padding:14px;border-radius:16px}
  .topline h2{font-size:22px}
  .day-body{padding:10px}
}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .main-card{box-shadow:none;border:0;border-radius:0;padding:14px 0}
  .pdf-actions{display:none!important}
  .header{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="header">
  <h1>INGENIERÍA EN HIPERTROFIA</h1>
  <p>Prescripción de entrenamiento individualizada</p>
</div>

<div class="wrap">
  <div class="main-card">
    <div class="topline">
      <div>
        <div class="eyebrow">Rutina</div>
        <h2 id="studentName">Tu entrenamiento</h2>
      </div>
      <div id="summary" class="summary"></div>
    </div>

    <div id="loading" class="loading">Cargando rutina…</div>
    <div id="routine"></div>
  </div>
  <div class="footer">Rutina actualizada por tu entrenador.</div>
  <div class="pdf-actions">
    <button id="downloadPdfBtn" class="pdf-btn" type="button">Descargar como PDF</button>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
const ROUTINES_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTMHhQr9bZmTQkw67Aj7v5mRXRIC-T3tUfkO8sxtBgcYcXBid-mEV31OaBbUagrK8csm32ON9a0rVuX/pub?gid=339469399&single=true&output=csv';
const ROUTINES_API = 'https://script.google.com/macros/s/AKfycbzOjyXStEHxg6G-qlYATcH7Po0tfrD6_ulcm0nBjxXqI8qA2-T0T0zJF4EKHS2xKgsu_w/exec';
const EXERCISES_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQq0vsM4pdfnzXMvN0WlceU4Tno44ttI_Xs4EPME_RpJuTbFwwx5aZx7v97wZs1BhLDu7TN5i1hCatY/pub?gid=41200741&single=true&output=csv';
const DAY_NAMES_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSosV9FXjIIj8qjK_UG5_SmH4_idZ0Fxo39TD4DPD1-DzRzsDYRFb7xGfu6OCSYrq5Ksi09RuWiAvtB/pub?gid=845125079&single=true&output=csv';
const STUDENTS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQq0vsM4pdfnzXMvN0WlceU4Tno44ttI_Xs4EPME_RpJuTbFwwx5aZx7v97wZs1BhLDu7TN5i1hCatY/pub?gid=1888921254&single=true&output=csv';
const NEW_STUDENTS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRonYAKol1CySnuHwPDVktKld_padRKy9F_ZYYogyDCkOz7hZkBFKCnxiYnej01QsUPPuhKjejEWWEQ/pub?gid=1004033237&single=true&output=csv';
const DAY_ORDER=['A','B','C','D','E','F'];
// Vista de rutina completa/PDF: no carga ni muestra intencion, sensacion ni error_evitar.

function normalizeHeader(h){
  return String(h||'').replace(/^\uFEFF/,'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function splitLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(q && line[i+1]==='"'){cur+='"';i++;}
      else q=!q;
    }else if(ch===',' && !q){out.push(cur);cur='';}
    else cur+=ch;
  }
  out.push(cur); return out;
}
function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='');
  if(!lines.length) return [];
  const headers=splitLine(lines[0]).map(normalizeHeader);
  return lines.slice(1).map(line=>{
    const vals=splitLine(line), o={};
    headers.forEach((h,i)=>o[h]=(vals[i]||'').trim());
    return o;
  });
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function dayTitle(day,labels){
  const cfg=labels[day];
  if(!cfg || !cfg.name) return 'Día '+day;
  return cfg.type==='BLOQUE' ? 'Bloque '+cfg.name : 'Día '+cfg.name;
}

function normalizedDaySortText(v){
  return String(v||'').trim().toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');
}
function weekdayIndexFromName(name){
  const t=normalizedDaySortText(name);
  const weekdays=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
  for(let i=0;i<weekdays.length;i++){
    if(new RegExp('(^|[^a-z])'+weekdays[i]+'([^a-z]|$)').test(t)) return i;
  }
  return -1;
}
function daySortName(day,labels){
  const cfg=labels[day];
  return String(cfg?.name || day || '').trim();
}
function compareDayIds(a,b,labels){
  const an=daySortName(a,labels), bn=daySortName(b,labels);
  const aw=weekdayIndexFromName(an), bw=weekdayIndexFromName(bn);

  if(aw>=0 && bw>=0 && aw!==bw) return aw-bw;
  if(aw>=0 && bw<0) return -1;
  if(aw<0 && bw>=0) return 1;

  const alpha=an.localeCompare(bn,'es',{sensitivity:'base',numeric:true});
  if(alpha!==0) return alpha;
  return DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b);
}

function buildDayLabels(rows,token){
  const labels={};
  rows.forEach(r=>{
    if(String(r.token||'').trim()!==token) return;
    const d=String(r.dia_id||r.dia||'').trim().toUpperCase();
    if(!DAY_ORDER.includes(d)) return;
    const name=String(r.nombre_visible||'').trim();
    const type=String(r.tipo_nombre||'DIA').trim().toUpperCase()==='BLOQUE'?'BLOQUE':'DIA';
    if(name) labels[d]={type,name}; else delete labels[d];
  });
  return labels;
}
function enrich(rows,lib){
  const byId=new Map(
    lib.filter(x=>x.id_ejercicio).map(x=>[
      String(x.id_ejercicio).trim(),
      {
        id_ejercicio:String(x.id_ejercicio||'').trim(),
        ejercicio:String(x.ejercicio||'').trim(),
        video_url:String(x.video_url||'').trim(),
        intencion:String(x.intencion||'').trim(),
        sensacion:String(x.sensacion||'').trim(),
        error_evitar:String(x.error_evitar||'').trim()
      }
    ])
  );
  return rows.map(r=>{
    const libRow=byId.get(String(r.id_ejercicio||'').trim())||{};
    return {
      ...r,
      ejercicio:r.ejercicio||libRow.ejercicio||'',
      video_url:libRow.video_url||'',
      intencion:libRow.intencion||'',
      sensacion:libRow.sensacion||'',
      error_evitar:libRow.error_evitar||''
    };
  });
}
function normalizeType(v){
  return String(v||'').trim().toUpperCase()==='COMBINADO'?'COMBINADO':'INDIVIDUAL';
}
function groupDay(rows){
  const groups=[], map=new Map();
  rows
    .sort((a,b)=>(Number(a.orden_bloque)||Number(a.orden)||0)-(Number(b.orden_bloque)||Number(b.orden)||0)
      ||(Number(a.orden_en_bloque)||1)-(Number(b.orden_en_bloque)||1))
    .forEach((r,idx)=>{
      const type=normalizeType(r.tipo_bloque);
      const id=String(r.bloque_id||'').trim() || ('LEGACY_'+idx);
      let g=map.get(id);
      if(!g){
        g={id,type,series:r.series||'',note:r.nota_entrenador||'',items:[]};
        map.set(id,g); groups.push(g);
      }
      if(!g.note && r.nota_entrenador) g.note=r.nota_entrenador;
      g.items.push(r);
    });
  return groups;
}
function metaPills(series,reps,tempo,load){
  const parts=[];
  if(series) parts.push(`<span class="pill">${esc(series)} series</span>`);
  if(reps) parts.push(`<span class="pill">${esc(reps)} reps</span>`);
  if(tempo) parts.push(`<span class="pill">Tempo ${esc(tempo)}</span>`);
  if(load) parts.push(`<span class="pill">Carga inicial ${esc(load)}</span>`);
  return parts.join('');
}
function renderPdfKeys(ex){
  const intention=String(ex.intencion||'').trim();
  const sensation=String(ex.sensacion||'').trim();
  const error=String(ex.error_evitar||'').trim();

  if(!intention && !sensation && !error) return '';

  return `
    <div class="pdf-keys">
      <div class="pdf-key">
        <div class="pdf-key-title">Intención</div>
        <div class="pdf-key-text">${esc(intention||'—')}</div>
      </div>
      <div class="pdf-key">
        <div class="pdf-key-title">Sensación</div>
        <div class="pdf-key-text">${esc(sensation||'—')}</div>
      </div>
      <div class="pdf-key">
        <div class="pdf-key-title">Error a evitar</div>
        <div class="pdf-key-text">${esc(error||'—')}</div>
      </div>
    </div>`;
}

function renderIndividual(block){
  const ex=block.items[0]||{};
  return `
    <div class="exercise-card">
      <div class="exercise-title">${esc(ex.ejercicio||'Ejercicio')}</div>
      <div class="exercise-meta">${metaPills(block.series,ex.reps,ex.tempo,ex.carga_inicial)}</div>
      ${block.note?`<div class="note">${esc(block.note)}</div>`:''}
      ${ex.video_url?`<a class="video" href="${esc(ex.video_url)}" target="_blank" rel="noopener noreferrer">▶ Ver video</a>`:''}
      ${renderPdfKeys(ex)}
    </div>`;
}
function renderSuperset(block){
  const exercises=block.items.map((ex,i)=>`
    <div class="super-ex">
      <div class="super-ex-name">${i+1}. ${esc(ex.ejercicio||'Ejercicio')}</div>
      <div class="super-ex-meta">
        ${esc(ex.reps||'—')} reps${ex.tempo?' · tempo '+esc(ex.tempo):''}${ex.carga_inicial?' · carga inicial '+esc(ex.carga_inicial):''}
      </div>
      ${ex.video_url?`<a class="video" href="${esc(ex.video_url)}" target="_blank" rel="noopener noreferrer">▶ Ver video</a>`:''}
      ${renderPdfKeys(ex)}
    </div>`).join('');
  return `
    <div class="super-card">
      <div class="super-head">
        <div>
          <div class="super-title">Superserie · ${block.items.length} ejercicios</div>
          <div class="super-sub">${esc(block.series||'—')} vueltas</div>
        </div>
      </div>
      <div class="super-list">${exercises}</div>
      ${block.note?`<div class="note">${esc(block.note)}</div>`:''}
    </div>`;
}
function renderRoutine(rows,labels){
  const byDay=new Map();
  rows.forEach(r=>{
    const d=String(r.dia||'').trim().toUpperCase();
    if(!byDay.has(d)) byDay.set(d,[]);
    byDay.get(d).push(r);
  });
  const days=DAY_ORDER.filter(d=>byDay.has(d)).sort((a,b)=>compareDayIds(a,b,labels));
  document.getElementById('summary').textContent=
    days.length+' día'+(days.length===1?'':'s')+'/semana';

  const root=document.getElementById('routine');
  root.innerHTML=days.map(day=>{
    const blocks=groupDay(byDay.get(day));
    const exerciseCount=blocks.reduce((n,b)=>n+b.items.length,0);
    const supers=blocks.filter(b=>b.type==='COMBINADO').length;
    const meta=exerciseCount+' ejercicio'+(exerciseCount===1?'':'s')+
      (supers?' · '+supers+' superserie'+(supers===1?'':'s'):'');
    return `
      <section class="day-card">
        <div class="day-head">
          <div class="day-title">${esc(dayTitle(day,labels))}</div>
          <div class="day-meta">${esc(meta)}</div>
        </div>
        <div class="day-body">
          ${blocks.map(b=>b.type==='COMBINADO'?renderSuperset(b):renderIndividual(b)).join('')}
        </div>
      </section>`;
  }).join('');
}

async function loadRoutineRowsFast(){
  try{
    const sep=ROUTINES_API.includes('?')?'&':'?';
    const res=await fetch(ROUTINES_API+sep+'t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!data || data.ok!==true || !Array.isArray(data.rows)){
      throw new Error(data && data.error ? data.error : 'Respuesta inválida de la API');
    }
    return data.rows.map(row=>{
      const out={};
      Object.entries(row||{}).forEach(([k,v])=>out[normalizeHeader(k)]=String(v??'').trim());
      return out;
    });
  }catch(e){
    console.warn('API directa no disponible; usando CSV publicado como respaldo.',e);
    const bust='&t='+Date.now();
    const res=await fetch(ROUTINES_CSV+bust,{cache:'no-store'});
    if(!res.ok) throw new Error('No se pudo cargar la rutina.');
    return parseCSV(await res.text());
  }
}


async function loadStudentNameOptional(token){
  try{
    const bust='&t='+Date.now();
    const results=await Promise.allSettled([
      fetch(STUDENTS_CSV+bust,{cache:'no-store'}),
      fetch(NEW_STUDENTS_CSV+bust,{cache:'no-store'})
    ]);

    const all=[];
    for(const r of results){
      if(r.status!=='fulfilled') continue;
      try{
        const txt=await r.value.text();
        all.push(...parseCSV(txt));
      }catch(e){}
    }

    const student=[...all].reverse().find(s=>String(s.token||'').trim()===token);
    if(student && String(student.nombre||'').trim()){
      document.getElementById('studentName').textContent=String(student.nombre).trim();
    }
  }catch(e){
    console.warn('No se pudo cargar el nombre de la alumna; la rutina seguirá funcionando.',e);
  }
}

function safePdfFilename(v){
  const cleaned=String(v||'Rutina')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[<>:"/\\|?*\x00-\x1F]/g,'')
    .replace(/\s+/g,' ')
    .trim();
  return (cleaned || 'Rutina').slice(0,80);
}

async function downloadRoutineAsSinglePagePdf(){
  const btn=document.getElementById('downloadPdfBtn');
  const original=btn.textContent;
  btn.disabled=true;
  btn.textContent='Generando PDF…';

  let exportRoot=null;
  try{
    if(typeof html2canvas!=='function' || !window.jspdf?.jsPDF){
      throw new Error('No se pudieron cargar las herramientas de PDF.');
    }

    // Clonamos la vista para generar siempre un PDF de ancho estable,
    // incluso cuando el alumno lo descarga desde el celular.
    exportRoot=document.createElement('div');
    exportRoot.className='pdf-export-root';

    const header=document.querySelector('.header')?.cloneNode(true);
    const wrap=document.querySelector('.wrap')?.cloneNode(true);
    if(!header || !wrap) throw new Error('No se encontró el contenido de la rutina.');

    // El botón de descarga no debe formar parte del PDF.
    wrap.querySelector('.pdf-actions')?.remove();

    exportRoot.appendChild(header);
    exportRoot.appendChild(wrap);
    document.body.appendChild(exportRoot);

    // Esperamos un frame para que el clon tome tamaños y estilos definitivos.
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));

    const canvas=await html2canvas(exportRoot,{
      scale:2,
      useCORS:true,
      backgroundColor:'#f4f5f6',
      logging:false,
      width:exportRoot.scrollWidth,
      height:exportRoot.scrollHeight,
      windowWidth:exportRoot.scrollWidth,
      windowHeight:exportRoot.scrollHeight,
      scrollX:0,
      scrollY:0
    });

    const {jsPDF}=window.jspdf;

    // jsPDF/PDF tiene un límite práctico de tamaño. Si la rutina fuese
    // extraordinariamente larga, reducimos proporcionalmente manteniendo
    // TODO el contenido dentro de una única página.
    const MAX_PT=14000;
    const pxToPt=72/96;
    let pageW=canvas.width/2*pxToPt;
    let pageH=canvas.height/2*pxToPt;
    const shrink=Math.min(1,MAX_PT/pageW,MAX_PT/pageH);
    pageW*=shrink;
    pageH*=shrink;

    const pdf=new jsPDF({
      orientation:pageW>pageH?'landscape':'portrait',
      unit:'pt',
      format:[pageW,pageH],
      compress:true
    });

    const img=canvas.toDataURL('image/jpeg',0.94);
    pdf.addImage(img,'JPEG',0,0,pageW,pageH,undefined,'FAST');

    const student=String(document.getElementById('studentName')?.textContent||'').trim();
    const filename=safePdfFilename(student && student!=='Tu entrenamiento'
      ? 'Rutina - '+student
      : 'Rutina');

    pdf.save(filename+'.pdf');
  }catch(e){
    console.error(e);
    alert('No se pudo generar el PDF. Probá nuevamente en unos segundos.');
  }finally{
    exportRoot?.remove();
    btn.disabled=false;
    btn.textContent=original;
  }
}

document.getElementById('downloadPdfBtn').addEventListener('click',downloadRoutineAsSinglePagePdf);

(async()=>{
  const loading=document.getElementById('loading');
  try{
    const token=(new URLSearchParams(location.search).get('token')||'').trim();
    if(!token) throw new Error('Falta el token de la rutina.');

    const bust='&t='+Date.now();
    const [allRoutineRows,libRes,namesRes]=await Promise.all([
      loadRoutineRowsFast(),
      fetch(EXERCISES_CSV+bust,{cache:'no-store'}),
      fetch(DAY_NAMES_CSV+bust,{cache:'no-store'})
    ]);
    const libText=await libRes.text();
    const namesText=await namesRes.text();

    const routineRows=allRoutineRows
      .filter(r=>String(r.token||'').trim()===token && r.dia && r.ejercicio);
    if(!routineRows.length) throw new Error('No hay una rutina vigente para este enlace.');

    const rows=enrich(routineRows,parseCSV(libText));
    const labels=buildDayLabels(parseCSV(namesText),token);
    loading.style.display='none';
    renderRoutine(rows,labels);
    loadStudentNameOptional(token);
  }catch(e){
    loading.className='error';
    loading.textContent='No se pudo cargar la rutina: '+e.message;
  }
})();
</script>
