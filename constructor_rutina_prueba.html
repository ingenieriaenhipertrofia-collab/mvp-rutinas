<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Constructor de rutina · Prueba</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#15171a;--muted:#6b7280;--line:#e5e7eb;--soft:#f9fafb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.header{background:#111827;color:#fff;padding:22px 18px}
.header h1{margin:0;font-size:22px}.header p{margin:5px 0 0;opacity:.75;font-size:14px}
.wrap{max-width:860px;margin:28px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.04);margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input,select{width:100%;padding:12px 13px;border:1px solid #cfd4dc;border-radius:10px;font-size:15px;background:#fff}
.search-wrap{position:relative}
.results{position:absolute;z-index:10;left:0;right:0;top:49px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.12);display:none;overflow:hidden}
.result{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}.result:last-child{border-bottom:0}.result:hover{background:var(--soft)}
.small{font-size:12px;color:var(--muted)}
.exercise-preview{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);display:none}
.exercise-preview b{display:block;margin-bottom:4px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
.primary{background:#111827;color:white}.secondary{background:#eef0f3;color:#111827}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:white}
.item-main{min-width:0}.item-title{font-weight:800}.item-sub{font-size:13px;color:var(--muted);margin-top:3px}
.order{width:28px;height:28px;border-radius:50%;background:#111827;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.item-left{display:flex;gap:12px;align-items:center;min-width:0}
.empty{color:var(--muted);padding:8px 0}
.note{font-size:13px;color:#4b5563;background:#f3f4f6;border-radius:10px;padding:11px 13px;margin-top:14px}
</style>
</head>
<body>
<div class="header">
  <h1>Constructor de rutina</h1>
  <p>Prueba de flujo · entrenador</p>
</div>

<div class="wrap">
  <div class="card">
    <div class="grid">
      <div>
        <label>Alumna</label>
        <select id="student">
          <option value="lara-test">Lara</option>
        </select>
      </div>
      <div>
        <label>Día</label>
        <select id="day">
          <option>A</option><option selected>B</option><option>C</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <label>Buscar ejercicio</label>
    <div class="search-wrap">
      <input id="search" placeholder="Ej.: Hack, remo, jalón…" autocomplete="off">
      <div id="results" class="results"></div>
    </div>

    <div id="preview" class="exercise-preview">
      <b id="previewName"></b>
      <div id="previewMeta" class="small"></div>
    </div>

    <div class="grid" style="margin-top:16px">
      <div>
        <label>Series</label>
        <input id="series" type="number" min="1" max="5" value="3">
      </div>
      <div>
        <label>Repeticiones</label>
        <input id="reps" placeholder="Ej.: 8-12">
      </div>
      <div>
        <label>Tempo</label>
        <input id="tempo" placeholder="Ej.: 1-0-3-1">
      </div>
      <div>
        <label>Carga inicial</label>
        <input id="load" placeholder="Ej.: 20 kg">
      </div>
    </div>

    <div class="actions">
      <button id="addBtn" class="primary" type="button">Agregar ejercicio</button>
    </div>

    <div class="note">Esta versión todavía no guarda en Google Sheets. Sirve para validar que el flujo de armado del día sea cómodo antes de conectar el guardado real.</div>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Rutina en construcción</h2>
    <div id="routineList" class="list"></div>
  </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQq0vsM4pdfnzXMvN0WlceU4Tno44ttI_Xs4EPME_RpJuTbFwwx5aZx7v97wZs1BhLDu7TN5i1hCatY/pub?gid=41200741&single=true&output=csv";
let exercises=[], selected=null, routine=[];

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function splitLine(line){
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(q && line[i+1]==='"'){cur+='"';i++;}
      else q=!q;
    }else if(ch===','&&!q){out.push(cur);cur='';}
    else cur+=ch;
  }
  out.push(cur);return out;
}
function parseCSV(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim()!=='');
  if(!lines.length) return [];
  const headers=splitLine(lines[0]).map(x=>x.trim());
  return lines.slice(1).map(line=>{
    const vals=splitLine(line), o={};
    headers.forEach((h,i)=>o[h]=(vals[i]||'').trim());
    return o;
  });
}
function renderResults(items){
  const box=document.getElementById('results');
  box.innerHTML='';
  if(!items.length){
    box.innerHTML='<div class="result small">No encontré ejercicios.</div>';
    box.style.display='block';return;
  }
  items.slice(0,8).forEach(ex=>{
    const d=document.createElement('div');
    d.className='result';d.textContent=ex.ejercicio;
    d.onclick=()=>choose(ex);box.appendChild(d);
  });
  box.style.display='block';
}
function choose(ex){
  selected=ex;
  document.getElementById('search').value=ex.ejercicio;
  document.getElementById('results').style.display='none';
  document.getElementById('preview').style.display='block';
  document.getElementById('previewName').textContent=ex.ejercicio;
  const bits=[];
  if(ex.video_url) bits.push('video cargado');
  if(ex.intencion||ex.sensacion||ex.error_evitar) bits.push('claves cargadas');
  document.getElementById('previewMeta').textContent=bits.length?bits.join(' · '):'Sin datos complementarios cargados';
}
function renderRoutine(){
  const box=document.getElementById('routineList');box.innerHTML='';
  if(!routine.length){box.innerHTML='<div class="empty">Todavía no agregaste ejercicios.</div>';return;}
  routine.forEach((r,i)=>{
    const item=document.createElement('div');item.className='item';
    const left=document.createElement('div');left.className='item-left';
    left.innerHTML='<div class="order">'+(i+1)+'</div><div class="item-main"><div class="item-title">'+r.ejercicio+'</div><div class="item-sub">'+r.series+' series · '+(r.reps||'—')+' reps · tempo '+(r.tempo||'—')+(r.load?' · '+r.load:'')+'</div></div>';
    const del=document.createElement('button');del.className='secondary';del.textContent='Quitar';
    del.onclick=()=>{routine.splice(i,1);renderRoutine();};
    item.append(left,del);box.appendChild(item);
  });
}
document.getElementById('search').addEventListener('input',e=>{
  const q=norm(e.target.value.trim());
  selected=null;
  document.getElementById('preview').style.display='none';
  if(!q){document.getElementById('results').style.display='none';return;}
  renderResults(exercises.filter(ex=>norm(ex.ejercicio).includes(q)||norm(ex.id_ejercicio).includes(q)));
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.search-wrap')) document.getElementById('results').style.display='none';
});
document.getElementById('addBtn').onclick=()=>{
  if(!selected){alert('Primero seleccioná un ejercicio de la biblioteca.');return;}
  routine.push({
    id_ejercicio:selected.id_ejercicio,
    ejercicio:selected.ejercicio,
    series:document.getElementById('series').value||'3',
    reps:document.getElementById('reps').value.trim(),
    tempo:document.getElementById('tempo').value.trim(),
    load:document.getElementById('load').value.trim()
  });
  renderRoutine();
  document.getElementById('search').value='';
  document.getElementById('preview').style.display='none';
  document.getElementById('reps').value='';
  document.getElementById('tempo').value='';
  document.getElementById('load').value='';
  selected=null;
};
(async()=>{
  try{
    const res=await fetch(CSV_URL+'&t='+Date.now(),{cache:'no-store'});
    exercises=parseCSV(await res.text()).filter(x=>x.ejercicio);
  }catch(e){
    alert('No se pudo cargar la biblioteca de ejercicios.');
  }
  renderRoutine();
})();
</script>
</body>
</html>
