<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingeniería en Hipertrofia — MVP</title>
<style>
:root{--ink:#14212b;--gold:#c5a548;--bg:#f4f5f6;--card:#fff;--muted:#6f7a82;--line:#d9dee2;--ok:#2f6f44}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.header{background:var(--ink);color:#fff;padding:20px 18px 16px;border-bottom:3px solid var(--gold)}
.header h1{margin:0;font-size:21px}
.header p{margin:4px 0 0;color:var(--gold);font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{color:var(--gold);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.progress{font-size:12px;color:var(--muted);font-weight:700}
h2{margin:7px 0 12px;font-size:25px}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 18px}
.meta div{background:#f7f8f9;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.meta b{display:block;font-size:16px}
.meta span{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.last-box{display:none;background:#f7f8f9;border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:11px 12px;margin:10px 0 16px}
.last-title{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.last-values{font-size:16px;font-weight:700}
.last-date{font-size:11px;color:var(--muted);margin-top:3px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
.series-row{display:flex;align-items:center;gap:8px;margin:10px 0;flex-wrap:wrap}
.series-row label{width:62px;font-weight:700}
.weight{width:100px;padding:11px 12px;font-size:18px;border:1px solid var(--line);border-radius:8px}
.unit{color:var(--muted);font-weight:700}
.same{display:none;border:1px solid var(--line);background:#f2f4f5;border-radius:7px;padding:9px 10px;cursor:pointer;font-weight:700;color:var(--ink)}
textarea{width:100%;min-height:84px;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit}
.optional{color:var(--muted);font-size:12px;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:18px}
button{cursor:pointer}
button.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:14px;font-size:15px;font-weight:700}
button.primary{border:0;background:var(--ink);color:#fff;border-radius:9px;padding:14px;font-size:15px;font-weight:700}
.status{min-height:20px;margin-top:10px;text-align:center;color:var(--ok);font-weight:700}
.hidden{display:none!important}
.loading{color:var(--muted)}
</style>
</head>
<body>
<div class="header">
  <h1>INGENIERÍA EN HIPERTROFIA</h1>
  <p>Prescripción de Entrenamiento Individualizada</p>
</div>

<div class="wrap">
  <div class="card">
    <div id="loading" class="loading">Cargando rutina…</div>

    <div id="app" class="hidden">
      <div class="topline">
        <div class="eyebrow">Día <span id="dia"></span></div>
        <div class="progress" id="progress"></div>
      </div>

      <h2 id="ejercicio"></h2>

      <div class="meta">
        <div><b id="series"></b><span>series</span></div>
        <div><b id="reps"></b><span>repeticiones</span></div>
        <div><b id="tempo"></b><span>tempo</span></div>
      </div>

      <div id="lastBox" class="last-box">
        <div class="last-title">Último registro</div>
        <div id="lastValues" class="last-values"></div>
        <div id="lastDate" class="last-date"></div>
      </div>

      <div class="section-title">Pesos utilizados hoy</div>
      <div id="seriesBox"></div>

      <div class="section-title">¿Algo relevante sobre este ejercicio?</div>
      <textarea id="comentario" placeholder="Escribí acá solo si hay algo que quieras registrar…"></textarea>
      <div class="optional">Opcional</div>

      <div class="actions">
        <button id="prevBtn" class="secondary" type="button">← Ejercicio anterior</button>
        <button id="nextBtn" class="primary" type="button">Siguiente ejercicio →</button>
      </div>

      <div class="status" id="status"></div>

      <form id="sendForm" action="https://docs.google.com/forms/d/e/1FAIpQLScIL5PUjSIgu19oF0nnNEcuQpafBtBVYNKYZjoMCpwYzuVFAQ/formResponse" method="POST" target="hidden_iframe" class="hidden">
        <input type="hidden" name="entry.1517609992" id="fToken">
        <input type="hidden" name="entry.972414767" id="fDia">
        <input type="hidden" name="entry.358785913" id="fEjercicio">
        <input type="hidden" name="entry.885442605" id="fS1">
        <input type="hidden" name="entry.1707252272" id="fS2">
        <input type="hidden" name="entry.1694946076" id="fS3">
        <input type="hidden" name="entry.813523569" id="fComentario">
      </form>
      <iframe name="hidden_iframe" class="hidden"></iframe>
    </div>

    <div id="done" class="hidden">
      <div class="eyebrow">Entrenamiento</div>
      <h2>✓ Día completado</h2>
      <p>Los registros fueron enviados.</p>
      <button id="reviewBtn" class="secondary" type="button">Revisar entrenamiento</button>
    </div>
  </div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQq0vsM4pdfnzXMvN0WlceU4Tno44ttI_Xs4EPME_RpJuTbFwwx5aZx7v97wZs1BhLDu7TN5i1hCatY/pub?gid=2129342034&single=true&output=csv';
const LAST_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQFcFqAzKtXE84pCJint6E2yeH9yFAYlFIVMgIA77Tcdvdy2O1og4qe-T-RgZqiFRS8UX1Fn0Y35TlU/pub?gid=1347015392&single=true&output=csv';
let rows = [];
let lastRows = [];
let current = 0;
let state = {};

function localDateKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function storageKey(){
  return `mvpRutinaState:${localDateKey()}`;
}

function stripBom(s){return s.replace(/^\uFEFF/,'')}
function normalizeHeader(s){
  return stripBom(String(s)).trim().toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'_');
}
function detectDelimiter(line){
  const ds=[',',';','\t']; let best=',',n=-1;
  for(const d of ds){const c=line.split(d).length-1;if(c>n){best=d;n=c}}
  return best;
}
function splitCsvLine(line,d){
  const out=[]; let cur='',q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(q && line[i+1]==='"'){cur+='"';i++} else q=!q;
    } else if(ch===d && !q){out.push(cur);cur=''} else cur+=ch;
  }
  out.push(cur); return out.map(v=>v.trim());
}
function parseCsv(text){
  const lines=stripBom(text).trim().split(/\r?\n/).filter(Boolean);
  const d=detectDelimiter(lines[0]);
  const headers=splitCsvLine(lines[0],d).map(normalizeHeader);
  return lines.slice(1).map(line=>{
    const vals=splitCsvLine(line,d),o={};
    headers.forEach((h,i)=>o[h]=vals[i]??'');
    return o;
  });
}
function keyFor(r){return `${r.token}|${r.dia}|${r.orden}|${r.ejercicio}`}
function saveCurrent(){
  const r=rows[current], key=keyFor(r);
  const weights=[...document.querySelectorAll('.weight')].map(el=>el.value);
  state[key]={weights, comentario:document.getElementById('comentario').value};
  localStorage.setItem(storageKey(), JSON.stringify(state));
}
function loadStored(){
  try{state=JSON.parse(localStorage.getItem(storageKey())||'{}')}catch(e){state={}}
}
function getLastRecord(r){
  const token=(r.token||'').trim();
  const ex=(r.ejercicio||'').trim().toLowerCase();
  return lastRows.find(x =>
    (x.token||'').trim()===token &&
    (x.ejercicio||'').trim().toLowerCase()===ex
  );
}

function getTodayRecord(r){
  const token=(r.token||'').trim();
  const ex=(r.ejercicio||'').trim().toLowerCase();
  return lastRows.find(x =>
    (x.token||'').trim()===token &&
    (x.ejercicio||'').trim().toLowerCase()===ex &&
    (
      String(x.hoy_s1||'').trim()!=='' ||
      String(x.hoy_s2||'').trim()!=='' ||
      String(x.hoy_s3||'').trim()!==''
    )
  );
}
function renderLast(r){
  const box=document.getElementById('lastBox');
  const rec=getLastRecord(r);
  if(!rec){ box.style.display='none'; return; }
  const vals=[rec.peso_s1,rec.peso_s2,rec.peso_s3].filter(v=>String(v).trim()!=='');
  if(!vals.length){ box.style.display='none'; return; }
  document.getElementById('lastValues').textContent=vals.join(' / ')+' kg';
  document.getElementById('lastDate').textContent=rec.fecha ? 'Registro anterior: '+rec.fecha : '';
  box.style.display='block';
}

function render(){
  const r=rows[current];
  document.getElementById('dia').textContent=r.dia;
  document.getElementById('ejercicio').textContent=r.ejercicio;
  document.getElementById('series').textContent=r.series;
  document.getElementById('reps').textContent=r.reps;
  document.getElementById('tempo').textContent=r.tempo;
  document.getElementById('progress').textContent=`Ejercicio ${current+1} de ${rows.length}`;
  renderLast(r);

  const n=Math.max(1,parseInt(r.series,10)||3);
  const todayRec=getTodayRecord(r);
  const fromToday=todayRec ? [
    todayRec.hoy_s1 || '',
    todayRec.hoy_s2 || '',
    todayRec.hoy_s3 || ''
  ] : [];
  const saved=state[keyFor(r)] || {weights:fromToday,comentario:''};
  const box=document.getElementById('seriesBox');
  box.innerHTML='';

  for(let i=0;i<n;i++){
    const row=document.createElement('div');
    row.className='series-row';

    const label=document.createElement('label');
    label.textContent=`Serie ${i+1}`;

    const input=document.createElement('input');
    input.type='number'; input.step='0.1'; input.inputMode='decimal';
    input.className='weight';
    input.value=saved.weights[i]||'';

    const unit=document.createElement('span');
    unit.className='unit'; unit.textContent='kg';

    row.append(label,input,unit);

    if(i>0){
      const same=document.createElement('button');
      same.type='button'; same.className='same'; same.textContent='↺ mismo';
      const prev=()=>box.querySelectorAll('.weight')[i-1];
      const sync=()=>{same.style.display=prev().value?'inline-block':'none'};
      same.addEventListener('click',()=>{input.value=prev().value; input.dispatchEvent(new Event('input',{bubbles:true}));});
      prev().addEventListener('input',sync);
      setTimeout(sync,0);
      row.append(same);
    }
    box.append(row);
  }

  document.getElementById('comentario').value=saved.comentario||'';
  document.getElementById('prevBtn').style.visibility=current===0?'hidden':'visible';
  document.getElementById('nextBtn').textContent=current===rows.length-1?'Finalizar entrenamiento':'Siguiente ejercicio →';
  document.getElementById('status').textContent='';
}

function hasMeaningfulData(saved){
  const hasWeight = (saved.weights || []).some(v => String(v).trim() !== '');
  const hasComment = String(saved.comentario || '').trim() !== '';
  return hasWeight || hasComment;
}

function sendCurrent(){
  const r=rows[current], saved=state[keyFor(r)]||{weights:[],comentario:''};

  // Si no hay ningún peso ni comentario, no crea una fila vacía en Google Forms.
  if(!hasMeaningfulData(saved)){
    return false;
  }

  document.getElementById('fToken').value=r.token||'';
  document.getElementById('fDia').value=r.dia||'';
  document.getElementById('fEjercicio').value=r.ejercicio||'';
  document.getElementById('fS1').value=saved.weights[0]||'';
  document.getElementById('fS2').value=saved.weights[1]||'';
  document.getElementById('fS3').value=saved.weights[2]||'';
  document.getElementById('fComentario').value=saved.comentario||'';
  document.getElementById('sendForm').submit();
  return true;
}

document.getElementById('prevBtn').addEventListener('click',()=>{
  saveCurrent();
  if(current>0){current--;render()}
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  saveCurrent();
  const sent = sendCurrent();
  document.getElementById('status').textContent = sent ? '✓ Guardado' : 'Sin datos para guardar';
  setTimeout(()=>{
    if(current<rows.length-1){current++;render()}
    else{
      document.getElementById('app').classList.add('hidden');
      document.getElementById('done').classList.remove('hidden');
    }
  },350);
});
document.getElementById('reviewBtn').addEventListener('click',()=>{
  document.getElementById('done').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  current=0; render();
});

(async()=>{
  try{
    loadStored();
    const [res,lastRes]=await Promise.all([fetch(CSV_URL,{cache:'no-store'}),fetch(LAST_CSV_URL,{cache:'no-store'})]);
    const text=await res.text();
    const lastText=await lastRes.text();
    rows=parseCsv(text)
      .filter(r=>r.ejercicio && r.dia)
      .sort((a,b)=>(a.dia||'').localeCompare(b.dia||'') || (Number(a.orden)||0)-(Number(b.orden)||0));
    lastRows=parseCsv(lastText);
    if(!rows.length) throw new Error('No hay ejercicios válidos en MVP_Public.');
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    render();
  }catch(e){
    document.getElementById('loading').textContent='Error al cargar la rutina: '+e.message;
  }
})();
</script>
</body>
</html>
